# Nakama on the hackathon VPS behind Coolify's Traefik (network "coolify"), same pattern as /opt/hk/yojimbo.
# Server layout: /opt/hk/nakama/.env (mode 600, copied from the Mac) and /opt/hk/nakama/app (git archive of main).
# Redeploy from the Mac: deploy/redeploy.sh. On the server:
#   cd /opt/hk/nakama/app && flock /opt/hk/.build.lock docker compose -f deploy/docker-compose.yml up -d --build
# DRY-RUN ONLY: NAKAMA_ALLOW_MAINNET and DEMO_SIGNER are forced empty below, so joins end after the Predict
# simulation, /execute refuses, and the server signs nothing. Real funds need Nick's explicit yes.
# CORS: the server answers every route with access-control-allow-origin: * (browser origins and native apps alike).
name: nakama
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hk-nakama:latest
    restart: unless-stopped
    init: true
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 0.5
    env_file:
      - path: ../../.env
        required: true
    environment:
      NAKAMA_PORT: "8787"
      NODE_OPTIONS: --max-old-space-size=384
      NAKAMA_ALLOW_MAINNET: ""
      DEMO_SIGNER: ""
    volumes:
      - nakama-data:/app/data
      - ../../download:/app/download:ro
    networks: [coolify]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.hk-nakama.rule=Host(`nakama.201-18-198-162.sslip.io`)
      - traefik.http.routers.hk-nakama.entrypoints=https
      - traefik.http.routers.hk-nakama.tls=true
      - traefik.http.routers.hk-nakama.tls.certresolver=letsencrypt
      - traefik.http.services.hk-nakama.loadbalancer.server.port=8080
volumes:
  nakama-data:
networks:
  coolify:
    external: true
